name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install "PyYAML==6.0.3" "ruff==0.16.4"

      - name: Compile-check all Python files
        run: python -m py_compile $(find . -type f -name '*.py' -not -path '*/.git/*')

      - name: Validate plugin manifests (YAML)
        run: python tests/validate_manifests.py

      # install.py is deliberately stdlib-only so it can be imported in isolation
      # (provider.py/__init__.py import the Hermes-only `providers` package).
      - name: Smoke test install.py (in isolation)
        run: python tests/test_install.py

      # Integration tests exercise the full pull -> serve -> stop lifecycle with
      # mocked process management. They live in their own file so the stdlib-only
      # smoke test stays independent; run every discovered module explicitly.
      - name: Integration tests (lifecycle, mocked)
        run: |
          for f in tests/integration/test_*.py; do
            echo "::group::$f"
            python "$f"
            status=$?
            echo "::endgroup::"
            [ $status -eq 0 ] || exit 1
          done

      - name: Lint with ruff
        run: ruff check .
