name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Full Python matrix on Linux (primary); Windows/macOS cover the
      # platform-specific paths (msvcrt locks, taskkill/CTRL_BREAK shutdown,
      # ctypes process probes, in-box curl) with the oldest+newest Pythons.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
    # bash on every runner so the POSIX-y steps below (find) work on Windows too.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install "PyYAML==6.0.3" "ruff==0.16.4"

      - name: Compile-check all Python files
        run: python -m py_compile $(find . -type f -name '*.py' -not -path '*/.git/*')

      - name: Validate plugin manifests (YAML)
        run: python tests/validate_manifests.py

      # install.py is deliberately stdlib-only so it can be imported in isolation
      # (provider.py/__init__.py import the Hermes-only `providers` package).
      - name: Smoke test install.py (in isolation)
        run: python tests/test_install.py

      - name: Integration test (pull → serve → stop lifecycle)
        run: python tests/integration/test_lifecycle.py

      - name: Lint with ruff
        run: ruff check .
