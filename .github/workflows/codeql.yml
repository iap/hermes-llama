name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@949a2dd6aedbaeaf7f59ac132aeb09d3aeb07f0a80 # v3.29.6
        with:
          languages: python
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@949a2dd6aedbaeaf7f59ac132aeb09d3aeb07f0a80 # v3.29.6

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@949a2dd6aedbaeaf7f59ac132aeb09d3aeb07f0a80 # v3.29.6
        with:
          category: "/language:python"
